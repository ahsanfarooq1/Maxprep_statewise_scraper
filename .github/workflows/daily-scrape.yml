name: MaxPreps scrape (2026-2027 season)

# Requires a self-hosted runner registered to this repo (Settings > Actions >
# Runners) on a machine that can actually reach MaxPreps - GitHub's own
# hosted runners exit via Azure datacenter IP ranges, which MaxPreps rejects
# with 406 regardless of headers (measured 2026-08-13, see commit 6e5c1a6).
# A residential/VPN connection - like the one already used for local runs -
# is what makes this work.
#
# Deliberately targets the `data` branch for its commits, NOT `master` - so
# an automated data commit never triggers a Streamlit Cloud redeploy (which
# watches `master` for code changes). Code changes still go through normal
# commits/PRs to `master` as always.
#
# Uses PowerShell (not `shell: bash`) throughout: on this self-hosted
# Windows runner, `shell: bash` resolves to WSL's bash.exe (no Linux distro
# installed there) rather than Git Bash, which fails immediately. PowerShell
# is what's actually confirmed present and working on this machine.
#
# SCHEDULE: Monday and Thursday only, with several check-in times spanning
# ~11am-6pm PKT (UTC+5 => 06:00-13:00 UTC) instead of one single nightly
# trigger. Combined with the "skip if already refreshed today" logic below,
# this gives natural retry behavior across the whole working window: if the
# laptop/VPN isn't up yet at the first check-in, that run fails fast and the
# NEXT check-in an hour or two later picks up wherever things were left off
# - no separate monitoring process needed.
on:
  schedule:
    - cron: '7 6 * * 1,4'    # ~11:07am PKT
    - cron: '37 7 * * 1,4'   # ~12:37pm PKT
    - cron: '7 9 * * 1,4'    # ~2:07pm PKT
    - cron: '37 10 * * 1,4'  # ~3:37pm PKT
    - cron: '7 12 * * 1,4'   # ~5:07pm PKT
  workflow_dispatch:
    inputs:
      states:
        description: 'Space-separated CODE:FolderName pairs to run (blank = all configured states)'
        required: false
        default: ''
      sports:
        description: 'Space-separated sports to run'
        required: false
        default: 'boys girls'
      force:
        description: 'Re-scrape even states already refreshed today'
        required: false
        default: 'false'

concurrency:
  group: maxpreps-scrape
  cancel-in-progress: false

# The auto-generated GITHUB_TOKEN is read-only by default; committing to the
# data branch needs write access.
permissions:
  contents: write

env:
  SEASON: '2026-2027'

jobs:
  scrape:
    runs-on: self-hosted
    # Generous ceiling so a healthy, still-making-progress run isn't killed
    # mid-state (150 min turned out too tight - even with zero games played
    # yet this season, schedule discovery alone took 146 min for just 4
    # states on 2026-10-01). The per-state-sport timeout below is what
    # actually guards against a genuine hang (the 2026-09-29 run went 13+
    # hours stuck on one state before that existed).
    timeout-minutes: 480
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout code (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: code

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Verify Python
        run: py --version

      - name: Install dependencies
        working-directory: code
        run: py -m pip install -r requirements.txt

      - name: Run pipeline per state, committing as each one finishes
        run: |
          $statesInput = "${{ github.event.inputs.states }}"
          if ([string]::IsNullOrWhiteSpace($statesInput)) {
            # Initial 10-state priority list (2026-10-01). The other 7
            # previously-scraped states (AZ, ID, KY, NV, OR, UT, WI) are still
            # supported via --state/the `states` input - just not run by
            # default until explicitly re-added here.
            $statesInput = "TX:Texas_scraped_data NM:NewMaxico_scraped_data OK:Oklahoma_scraped_data AR:Arkansas_scraped_data LA:Louisiana_scraped_data IN:Indiana_scraped_data OH:Ohio_scraped_data WA:Washington_scraped_data MI:Michigan_scraped_data CO:Colorado_Scraped_data"
          }
          $sportsInput = "${{ github.event.inputs.sports }}"
          if ([string]::IsNullOrWhiteSpace($sportsInput)) {
            $sportsInput = "boys girls"
          }
          $force = "${{ github.event.inputs.force }}" -eq 'true'

          $entries = $statesInput -split '\s+' | Where-Object { $_ -ne '' }
          $sports  = $sportsInput -split '\s+' | Where-Object { $_ -ne '' }

          $codeDir = Join-Path $env:GITHUB_WORKSPACE "code"
          $dataDir = Join-Path $env:GITHUB_WORKSPACE "data"
          $today   = [DateTime]::UtcNow.ToString('yyyy-MM-dd')

          # 30 min per state/sport. If MaxPreps or the network hangs on one
          # state, this is what stops it from burning the entire window -
          # kill it and move on, the skip-check below will retry it at the
          # next check-in instead of blocking everything after it today.
          $maxMs = 30 * 60 * 1000

          Set-Location $dataDir
          git config user.name "maxpreps-daily-bot"
          git config user.email "actions@users.noreply.github.com"

          $done = 0
          $skipped = 0
          $failed = 0

          foreach ($entry in $entries) {
            $parts  = $entry -split ':', 2
            $code   = $parts[0]
            $folder = $parts[1]
            $outDir = Join-Path $dataDir $folder
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null

            foreach ($sport in $sports) {
              $gapsFile = Join-Path $outDir "$($code.ToLower())_data_gaps_${sport}_2026_2027.json"

              $skip = $false
              if (-not $force -and (Test-Path $gapsFile)) {
                try {
                  $meta = (Get-Content $gapsFile -Raw | ConvertFrom-Json).meta
                  if ($meta.last_updated -and $meta.last_updated.StartsWith($today)) {
                    $skip = $true
                  }
                } catch {
                  # Unreadable/partial file from an earlier interrupted run -
                  # do NOT trust it as "done today", re-run it for real.
                  $skip = $false
                }
              }

              if ($skip) {
                Write-Output "::group::$code ($sport) - already refreshed today, skipping"
                Write-Output "::endgroup::"
                $skipped++
                continue
              }

              Write-Output "::group::$code ($sport)"
              Set-Location $codeDir
              $proc = Start-Process -FilePath "py" -ArgumentList @(
                "APP/pipeline.py", "--state", $code, "--sport", $sport,
                "--season", $env:SEASON, "--output-dir", $outDir, "--workers", "15"
              ) -NoNewWindow -PassThru
              $finished = $proc.WaitForExit($maxMs)
              if (-not $finished) {
                Write-Output "[WARN] $code $sport exceeded $($maxMs/60000) min - killing, will retry at the next check-in"
                try { $proc.Kill() } catch {}
                $failed++
              } elseif ($proc.ExitCode -ne 0) {
                Write-Output "[WARN] $code $sport pipeline exited $($proc.ExitCode) - will retry at the next check-in"
                $failed++
              } else {
                $done++
              }
              Write-Output "::endgroup::"

              # Commit + push THIS state/sport's result right now, whatever
              # it is - a partial/killed run's OWN files may still have
              # earlier stages' output worth keeping, and a later failure
              # elsewhere must never take this progress down with it.
              Set-Location $dataDir
              git add -A
              git diff --cached --quiet
              if ($LASTEXITCODE -ne 0) {
                $stamp = [DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm')
                git commit -m "Scrape: $code $sport - $stamp UTC" | Out-Null
                git push origin data
              }
            }
          }

          Write-Output "Done: $done  Skipped (already fresh today): $skipped  Failed/timed out: $failed"
          exit 0
