name: Daily MaxPreps scrape (2026-2027 season)

# Requires a self-hosted runner registered to this repo (Settings > Actions >
# Runners) on a machine that can actually reach MaxPreps - GitHub's own
# hosted runners exit via Azure datacenter IP ranges, which MaxPreps rejects
# with 406 regardless of headers (measured 2026-08-13, see commit 6e5c1a6).
# A residential/VPN connection - like the one already used for local runs -
# is what makes this work.
#
# Deliberately targets the `data` branch for its commits, NOT `master` - so
# a daily automated data commit never triggers a Streamlit Cloud redeploy
# (which watches `master` for code changes). Code changes still go through
# normal commits/PRs to `master` as always.
#
# Uses PowerShell (not `shell: bash`) throughout: on this self-hosted
# Windows runner, `shell: bash` resolves to WSL's bash.exe (no Linux distro
# installed there) rather than Git Bash, which fails immediately. PowerShell
# is what's actually confirmed present and working on this machine.

on:
  schedule:
    # 09:17 UTC ~ 1:17am Pacific / 4:17am Eastern - off-peak, non-round
    # minute (GitHub's scheduler is best-effort and round times get delayed
    # most). Adjust freely; this is not load-bearing anywhere else.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      states:
        description: 'Space-separated CODE:FolderName pairs to run (blank = all configured states)'
        required: false
        default: ''
      sports:
        description: 'Space-separated sports to run'
        required: false
        default: 'boys girls'

concurrency:
  group: daily-maxpreps-scrape
  cancel-in-progress: false

env:
  SEASON: '2026-2027'

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 480
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout code (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: code

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Verify Python
        run: py --version

      - name: Install dependencies
        working-directory: code
        run: py -m pip install -r requirements.txt

      - name: Run pipeline per state
        working-directory: code
        run: |
          $statesInput = "${{ github.event.inputs.states }}"
          if ([string]::IsNullOrWhiteSpace($statesInput)) {
            $statesInput = "AZ:Arizona_Scraped_data AR:Arkansas_scraped_data CO:Colorado_Scraped_data ID:Idaho_scraped_data IN:Indiana_scraped_data KY:Kentucky_Scraped_data LA:Louisiana_scraped_data MI:Michigan_scraped_data NV:Nevada_Scraped_data NM:NewMaxico_scraped_data OH:Ohio_scraped_data OK:Oklahoma_scraped_data OR:Oregon_scraped_data TX:Texas_scraped_data UT:Utah_Scraped_data WA:Washington_scraped_data WI:Wisconsin_scraped_data"
          }
          $sportsInput = "${{ github.event.inputs.sports }}"
          if ([string]::IsNullOrWhiteSpace($sportsInput)) {
            $sportsInput = "boys girls"
          }

          $entries = $statesInput -split '\s+' | Where-Object { $_ -ne '' }
          $sports  = $sportsInput -split '\s+' | Where-Object { $_ -ne '' }

          $failed = 0
          foreach ($entry in $entries) {
            $parts  = $entry -split ':', 2
            $code   = $parts[0]
            $folder = $parts[1]
            $outDir = Join-Path $env:GITHUB_WORKSPACE "data\$folder"
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null

            foreach ($sport in $sports) {
              Write-Output "::group::$code ($sport)"
              py APP/pipeline.py --state $code --sport $sport --season $env:SEASON --output-dir $outDir --workers 15
              if ($LASTEXITCODE -ne 0) {
                Write-Output "[WARN] $code $sport pipeline exited $LASTEXITCODE - continuing with the next state/sport"
                $failed++
              }
              Write-Output "::endgroup::"
            }
          }
          Write-Output "Failed state/sport runs: $failed"
          exit 0

      - name: Commit and push updated data
        working-directory: data
        run: |
          git config user.name "maxpreps-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "No changes to commit."
          } else {
            $stamp = [DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm')
            git commit -m "Daily scrape: $stamp UTC"
            git push origin data
          }
