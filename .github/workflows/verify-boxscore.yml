name: Verify box-score fetching

# Runs verify_boxscore_live.py against LIVE MaxPreps.
#
# HEADS UP — this currently cannot verify anything from GitHub Actions.
# Measured 2026-08-13: the runner exits via Azure (AS8075 Microsoft, US Moses
# Lake) and MaxPreps answers every request with 406 Not Acceptable. It is NOT
# geography (that runner is in the US) and NOT headers (reverting them changed
# nothing) — MaxPreps rejects datacenter IP ranges. The same commit verifies
# clean from a residential/VPN US exit, so run it locally instead:
#
#     python verify_boxscore_live.py
#
# Kept as manual-only (no push trigger) so it doesn't mark every commit red
# for an infrastructure limitation, and so it's ready if MaxPreps ever stops
# blocking these ranges. A detected block reports as inconclusive, not failed.
#
# Results are committed to diagnostics/boxscore-verification.md so they're
# readable without digging through Actions logs.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify live box-score fetch
        id: verify
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p diagnostics
          python verify_boxscore_live.py 2>&1 | tee diagnostics/boxscore-verification.md
          echo "exit_status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit results
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/boxscore-verification.md
          git commit -m "CI: box-score verification results [skip ci]" || echo "no change"
          git push || echo "push failed"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxscore-verification
          path: diagnostics/
          retention-days: 14

      # A 403/406 block from the runner's own IP is an infrastructure limit,
      # not a defect in the scraper — report it as inconclusive so the job
      # doesn't cry wolf. Anything else that fails is a real failure.
      - name: Interpret result
        if: steps.verify.outputs.exit_status != '0'
        run: |
          if grep -qE '40[36]' diagnostics/boxscore-verification.md; then
            echo "::warning::INCONCLUSIVE — MaxPreps blocked this runner's IP "\
                 "(datacenter range). Run 'python verify_boxscore_live.py' "\
                 "locally behind a residential/VPN US exit instead."
            exit 0
          fi
          echo "Box-score verification FAILED — see diagnostics/boxscore-verification.md"
          exit 1
