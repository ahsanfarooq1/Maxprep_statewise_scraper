name: Run MaxPreps Scraper

on:
  workflow_dispatch:
    inputs:
      state:
        description: "State code (e.g. NM, TX, CA)"
        required: true
        default: "NM"
      sport:
        description: "Sport"
        required: true
        default: "boys"
        type: choice
        options:
          - boys
          - girls
      season:
        description: "Season (e.g. 2025-2026)"
        required: true
        default: "2025-2026"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runs the full 4-stage pipeline. Calling app.py directly (as this
      # workflow used to) only covers stage 1 plus its auto-chained box-score
      # stage — it skips the stats-tab scrape and the final accumulation, so
      # no Final_* file was ever produced.
      - name: Run pipeline
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p scraper_output
          python -m APP.pipeline \
            --state ${{ github.event.inputs.state }} \
            --sport ${{ github.event.inputs.sport }} \
            --season ${{ github.event.inputs.season }} \
            --output-dir scraper_output

      - name: Upload output files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-output-${{ github.event.inputs.state }}-${{ github.event.inputs.sport }}-${{ github.event.inputs.season }}
          path: scraper_output/
          retention-days: 7
